version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: nuget
  directories:
  - /OpenAPI/Generated.Client/src/Synesthesias.PLATEAU.Snap.Generated
  - /OpenAPI/Generated.Client/src/Synesthesias.PLATEAU.Snap.Generated.Test
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
